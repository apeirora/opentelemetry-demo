#
# Sidecar next to checkout:
#   auditlogreceiver (/v1/audit) -> signing (HMAC) -> main otel-collector
#
# Requires a collector image that includes auditlogreceiver + signingprocessor
# (see src/otel-collector/Dockerfile.audit-sidecar).

extensions:
  redis_storage/wal:
    endpoint: audit-redis:6379
    db: 2
    tls:
      insecure: true

receivers:
  auditlogreceiver:
    endpoint: 0.0.0.0:4320
    path: /v1/audit
    response_mode: sync
    storage: redis_storage/wal
    circuit_breaker:
      enabled: true
      circuit_open_threshold: 3
      circuit_open_duration: 30s
      open_behavior: accept

processors:
  signing:
    algorithm: HMAC-SHA256
    certificate_ref: ""
    key_source:
      type: file
      file:
        hmac_key_file: /etc/auditlog/keys/dev_hmac_key.txt

exporters:
  otlp_http/main:
    endpoint: http://otel-collector:4318
    timeout: 8s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 500ms
      max_interval: 2s
      max_elapsed_time: 8s
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
  extensions: [redis_storage/wal]
  pipelines:
    logs/audit:
      receivers: [auditlogreceiver]
      processors: [signing]
      exporters: [otlp_http/main]
